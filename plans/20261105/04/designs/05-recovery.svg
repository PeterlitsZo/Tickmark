<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Uncertain write recovery with retained draft"><title>Uncertain write recovery with retained draft</title><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#FBFBFA" stroke="none"/><text x="24" y="28" fill="#292D29" font-size="14" font-weight="600">9:41</text><text x="294" y="28" fill="#292D29" font-size="13" font-weight="400">●  ▰  ▰</text><rect x="132" y="828" width="126" height="4" rx="2" fill="#292D29" stroke="none"/><text x="22" y="75" fill="#425D48" font-size="15" font-weight="600">‹  Back to calendar</text><text x="22" y="122" fill="#292D29" font-size="28" font-weight="650">Check this save</text><text x="22" y="153" fill="#747970" font-size="15" font-weight="400">Your draft is still here.</text><rect x="22" y="186" width="346" height="112" rx="12" fill="#F9EEE8" stroke="none"/><text x="38" y="215" fill="#8D4934" font-size="16" font-weight="600">We couldn’t confirm the change.</text><text x="38" y="242" fill="#8D4934" font-size="14" font-weight="400">It may already be saved. Check its</text><text x="38" y="264" fill="#8D4934" font-size="14" font-weight="400">status before trying again.</text><text x="22" y="338" fill="#747970" font-size="11" font-weight="600">ENTRY DRAFT</text><rect x="22" y="355" width="346" height="132" rx="12" fill="white" stroke="#E8EAE4"/><text x="38" y="387" fill="#292D29" font-size="20" font-weight="600">Prepare release</text><text x="38" y="417" fill="#365B87" font-size="14" font-weight="500">●  Work</text><text x="38" y="450" fill="#747970" font-size="15" font-weight="400">Nov 5 · 09:10 – 10:25</text><rect x="22" y="511" width="346" height="46" rx="10" fill="#425D48" stroke="none"/><text x="38" y="540" fill="#FFFFFF" font-size="15" font-weight="600">Check status</text><text x="22" y="593" fill="#292D29" font-size="17" font-weight="600">What happens next</text><text x="22" y="625" fill="#747970" font-size="13" font-weight="400">We check the original and updated ranges.</text><text x="22" y="648" fill="#747970" font-size="13" font-weight="400">If we find a matching new entry, you choose</text><text x="22" y="671" fill="#747970" font-size="13" font-weight="400">whether to use it. No automatic retry.</text><path d="M22 706H368" stroke="#E8EAE4"/><text x="22" y="737" fill="#292D29" font-size="14" font-weight="600">Can’t connect?</text><text x="22" y="762" fill="#747970" font-size="13" font-weight="400">Keep this screen open and try when online.</text><text x="22" y="785" fill="#747970" font-size="12" font-weight="400">Drafts are not saved after closing the app.</text></g></svg>