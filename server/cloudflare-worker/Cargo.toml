[package]
name = "tickmark-cloudflare-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tickmark-core = { path = "../core" }
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
indoc = "2"
base64 = "0.22"
